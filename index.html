<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <meta name="description" content="StackNote — build ServiceNow work notes, KB references and email replies in seconds, then copy them with one click.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StackNote">
  <title>StackNote — ServiceNow Note Builder</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app-shell">
    <header id="header-root" class="topbar"></header>
    <nav id="tabs-root" class="tabs" aria-label="Main navigation"></nav>
    <main id="view" tabindex="-1"></main>
    <footer class="footnote">
      <span>StackNote · works offline · your data stays in this browser unless you enable sync</span>
      <span id="build-stamp"></span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <div id="mobile-copybar" class="mobile-copybar"></div>

  <noscript>
    <div style="padding:24px;font-family:system-ui">StackNote needs JavaScript to run. Please enable it in your browser.</div>
  </noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
